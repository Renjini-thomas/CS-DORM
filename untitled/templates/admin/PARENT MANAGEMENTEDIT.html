{%  extends 'admin/index.html' %}
{% block body %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
<center><font color="#ffd700" ><u><h1><b>EDIT PARENT DETAILS</b></h1></u></font></center><br/>
<form id="form1" name="form1" method="post" action="/parentmanagementeditbutton/{{ data.id }}">
    {% csrf_token %}
  <table width="200" border="1" class="table table-bordered">
    <tr>
      <th scope="row">NAME</th>
      <td><label for="textfield"></label>
      <input type="text" name="textfield" id="textfield" value="{{ data.parentname }}" required/></td>
    </tr>
      <tr>
      <th scope="row">OCCUPATION</th>
      <td><label for="textfield"></label>
      <input type="text" name="textfield5" id="textfield" required/></td>
    </tr>
    <tr>
      <th scope="row">PHN NO</th>
      <td><label for="textfield2"></label>
      <input type="text" name="textfield2" id="textfield2" value="{{ data.phoneno }}" required/></td>
    </tr>
    <tr>
      <th scope="row">EMAIL ID</th>
      <td><label for="textfield3"></label>
      <input type="text" name="textfield3" id="textfield3" value="{{ data.emailid }}" required/></td>
    </tr>
    <tr>
      <th colspan="2" scope="row"><input type="submit" name="button" id="button" value="ADD" /></th>
    </tr>
  </table>
</form>
</body>
</html>
{% endblock %}
