{%  extends 'admin/index.html' %}
{% block body %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
<center><font color="#ffd700" ><u><h1><b>ADD STAFF DETAILS</b></h1></u></font></center><br/>
<form id="form1" name="form1" method="post" action="/staffmanagementbutton" enctype="multipart/form-data">
    {% csrf_token %}
  <table width="250" border="1" class="table table-bordered">
    <tr>
      <th width="172" scope="row">STAFF NAME</th>
      <td width="62"><label for="textfield"></label>
      <input type="text" name="textfield" id="textfield" required /></td>
    </tr>
    <tr>
      <th scope="row">PHOTO</th>
      <td>&nbsp;<label for="input"></label><input type="file" name="file" id="input"required/></td>
    </tr>
    <tr>
      <th scope="row">QUALIFICATION</th>
      <td><label for="textarea"></label>
      <textarea name="textarea" id="textarea" cols="45" rows="5" required></textarea></td>
    </tr>
    <tr>
      <th scope="row">MOBILE NO</th>
      <td><label for="textfield2"></label>
      <input type="text" name="textfield2" id="textfield2" required maxlength="10" pattern="[6-9][0-9]{9}"/></td>
    </tr>
    <tr>
      <th scope="row">EMAIL</th>
      <td><label for="textfield3"></label>
      <input type="email" name="textfield3" id="textfield3"required/></td>
    </tr>
    <tr>
      <th scope="row">EXPERIANCE</th>
      <td><label for="textarea2"></label>
      <textarea name="textarea2" id="textarea2" cols="45" rows="5" required></textarea></td>
    </tr>
    <tr>
      <th scope="row">POST</th>
      <td><label for="textfield4"></label>
      <input type="text" name="textfield4" id="textfield4" required /></td>
    </tr>
    <tr>
      <th colspan="2" scope="row"> <div class="col-md-12">
                  <fieldset>
                    <button type="submit" id="form-submit" class="button">SUBMIT</button>
                  </fieldset>
                </div> </th>
    </tr>
  </table>
</form>
</body>
</html>
{% endblock %}
