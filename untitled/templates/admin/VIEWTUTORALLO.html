{%  extends 'admin/index.html' %}
{% block body %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
<center><font color="#ffd700" ><u><h1><b>TUTORS</b></h1></u></font></center><br/>
<form id="form1" name="form1" method="post" action="">

  <table width="342" border="1" class="table table-bordered">
    <tr style="color: whitesmoke">
      <th width="76" scope="col">SL NO</th>
      <th width="76" scope="col">YEAR</th>
      <th width="9" scope="col">STAFF</th>
      <th width="153" scope="col">&nbsp;</th>
    </tr>
      {% for i in data %}
    <tr>
        <td>&nbsp;<font color="white"> {{ forloop.counter }}</font></td>
      <td>&nbsp;<font color="white" >{{ i.year }}</font></td>
        <td>&nbsp;<font color="white" >{{ i.STAFF.staffname }}</font></td>
      <td><a href="/deletetutoralloc/{{ i.id }}" onclick="return confirm('Are you sure?')">DELETE</a></td>
    </tr>
      {% endfor %}
  </table>
</form>
</body>
</html>
{% endblock %}
