{%  extends 'STAFF/index.html' %}
{% block body %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
<center><font color="#ffd700" ><u><h1><b>ADD ADDITIONAL DETAILS</b></h1></u></font></center><br/>
<form id="form1" name="form1" method="post" action="/moredetailsbutton/{{ s }}#log">
  <table width="311" border="1">
    <tr>
      <th width="146" scope="row">AADHAR NO.</th>
      <td width="149"><label for="textfield"></label>
      <input type="text" name="textfield" id="textfield" maxlength="12" required/></td>
    </tr>
    <tr>
      <th scope="row">BLOOD GROUP</th>
      <td><label for="textfield2"></label>
        <label for="select3"></label>
        <select name="select3" id="select3">
            <option>A+ve</option>
            <option>A-ve</option>
            <option>B+ve</option>
            <option>A-ve</option>
            <option>O+ve</option>
            <option>O-ve</option>
            <option>AB+ve</option>
            <option>AB-ve</option>
      </select></td>
    </tr>
    <tr>
      <th scope="row">HEIGHT</th>
      <td><label for="textfield3"></label>
      <input type="text" name="textfield3" id="textfield3" required/></td>
    </tr>
    <tr>
      <th scope="row">WEIGHT</th>
      <td><label for="textfield4"></label>
      <input type="text" name="textfield4" id="textfield4" required/></td>
    </tr>
    <tr>
      <th scope="row">RELIGION</th>
      <td><label for="textfield5"></label>
        <label for="select"></label>
        <select name="select" id="select">
            <option>CHRISTIAN</option>
            <option>HINDU</option>
            <option>MUSLIM</option>
      </select></td>
    </tr>
    <tr>
      <th scope="row">CASTE</th>
      <td><label for="select2"></label>
        <select name="select2" id="select2">
            <option>GENERAL</option>
            <option>OBC</option>
            <option>SC/ST</option>
      </select></td>
    </tr>

    <tr>
      <th scope="row">ANNUAL INCOME</th>
      <td><label for="textfield8"></label>
      <input type="text" name="textfield8" id="textfield8" required/></td>
    </tr>
    <tr>
      <th scope="row">RATION CATEGORY</th>
      <td><label for="select4"></label>
        <select name="select4" id="select4">
            <option>APL</option>
            <option>BPL</option>
      </select></td>
    </tr>
    <tr>
      <th scope="row">SKILLS</th>
      <td><label for="textarea"></label>
      <textarea name="textarea" id="textarea" cols="45" rows="5" required></textarea></td>
    </tr>
    <tr>
      <th scope="row">10th PERCENTAGE</th>
      <td><label for="textfield9"></label>
      <input type="text" name="textfield9" id="textfield9" required/></td>
    </tr>
    <tr>
      <th scope="row">12th PERCENTAGE</th>
      <td><label for="textfield10"></label>
      <input type="text" name="textfield10" id="textfield10" required/></td>
    </tr>
    <tr>
      <th scope="row">LANGUAGES KNOWN</th>
      <td><label for="textarea2"></label>
      <textarea name="textarea2" id="textarea2" cols="45" rows="5" required></textarea></td>
    </tr>
    <tr>
      <th colspan="2" scope="row"><input type="submit" name="button" id="button" value="Submit" /></th>
    </tr>
  </table>
</form>
</body>
</html>
{% endblock %}
