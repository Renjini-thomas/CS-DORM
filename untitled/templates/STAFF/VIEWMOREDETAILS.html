{%  extends 'STAFF/index.html' %}
{% block body %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
<form id="form1" name="form1" method="post" action="/editmoredetailsbutton/{{ data.id }}#log">
  <table width="311" border="1">
    <tr>
      <th width="146" scope="row">AADHAR NO.</th>
      <td width="149"><label for="textfield"></label>
      <input type="text" name="textfield" id="textfield" value="{{ data.aadharno }}" required class="form-control"/></td>
    </tr>
    <tr>
      <th scope="row">BLOOD GROUP</th>
      <td><label for="textfield2"></label>
        <label for="select3"></label>
        <select name="select3" id="select3" required class="form-control">

            <option {% if data.bloodg == 'A+ve' %}selected{% endif %}>A+ve</option>
            <option {% if data.bloodg == 'A-ve' %}selected{% endif %}>A-ve</option>
            <option {% if data.bloodg == 'B+ve' %}selected{% endif %}>B+ve</option>
            <option {% if data.bloodg == 'B-ve' %}selected{% endif %}>A-ve</option>
            <option {% if data.bloodg == 'O+ve' %}selected{% endif %}>O+ve</option>
            <option {% if data.bloodg == 'O-ve' %}selected{% endif %}>O-ve</option>
            <option {% if data.bloodg == 'AB+ve' %}selected{% endif %}>AB+ve</option>
            <option {% if data.bloodg == 'AB-ve' %}selected{% endif %}>AB-ve</option>
      </select></td>
    </tr>
    <tr>
      <th scope="row">HEIGHT</th>
      <td><label for="textfield3"></label>
      <input type="text" name="textfield3" id="textfield3" value="{{ data.height }}" required class="form-control"/></td>
    </tr>
    <tr>
      <th scope="row">WEIGHT</th>
      <td><label for="textfield4"></label>
      <input type="text" name="textfield4" id="textfield4" value="{{ data.weight }}" required class="form-control"/></td>
    </tr>
    <tr>
      <th scope="row">RELIGION</th>
      <td><label for="textfield5"></label>
        <label for="select"></label>
        <select name="select" id="select" required class="form-control">
            <option {% if  data.religion == 'CHRISTIAN' %}selected{% endif %}>CHRISTIAN</option>
            <option {% if  data.religion == 'HINDU' %}selected{% endif %}>HINDU</option>
            <option {% if  data.religion == 'MUSLIM' %}selected{% endif %}>MUSLIM</option>
      </select></td>
    </tr>
    <tr>
      <th scope="row">CASTE</th>
      <td><label for="select2"></label>
        <select name="select2" id="select2" required class="form-control">

            <option {% if  data.caste == 'GENERAL' %}selected{% endif %}>GENERAL</option>
            <option {% if  data.caste == 'OBC' %}selected{% endif %}>OBC</option>
            <option {% if  data.caste == 'SC/ST' %}selected{% endif %}>SC/ST</option>
      </select></td>
    </tr>

    <tr>
      <th scope="row">ANNUAL INCOME</th>
      <td><label for="textfield8"></label>
      <input type="text" name="textfield8" id="textfield8" value="{{ data.annincome }}" required class="form-control"/></td>
    </tr>
    <tr>
      <th scope="row">RATION CATEGORY</th>
      <td><label for="select4"></label>
        <select name="select4" id="select4" required class="form-control">

            <option {% if  data.rationcard == 'APL' %}selected{% endif %}>APL</option>
            <option {% if  data.rationcard == 'BPL' %}selected{% endif %}>BPL</option>
      </select></td>
    </tr>
    <tr>
      <th scope="row">SKILLS</th>
      <td><label for="textarea"></label>
      <textarea name="textarea" id="textarea" cols="45" rows="5" required>{{ data.skills }}</textarea></td>
    </tr>
    <tr>
      <th scope="row">10th PERCENTAGE</th>
      <td><label for="textfield9"></label>
      <input type="text" name="textfield9" id="textfield9" value="{{ data.ten }}" required class="form-control"/></td>
    </tr>
    <tr>
      <th scope="row">12th PERCENTAGE</th>
      <td><label for="textfield10"></label>
      <input type="text" name="textfield10" id="textfield10" value="{{ data.plustwo }}" required class="form-control"/></td>
    </tr>
    <tr>
      <th scope="row">LANGUAGES KNOWN</th>
      <td><label for="textarea2"></label>
      <textarea name="textarea2" id="textarea2" cols="45" rows="5" required class="form-control">{{ data.languages }}</textarea></td>
    </tr>
    <tr>
      <th colspan="2" scope="row">
        <div class="col-md-12">
                  <fieldset>
                      <input type="submit" id="form-submit" class="button" name="s" value="Update">

                      <input type="submit" id="form-submit" class="button" name="s" value="Remove"/>
                  </fieldset>
         </div>

      </th>
    </tr>
  </table>
</form>
</body>
</html>
{% endblock %}
