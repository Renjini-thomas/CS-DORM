<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
<form id="form1" name="form1" method="post" action="">
  <table width="416" border="1">
    <tr>
      <th width="8" scope="col">#</th>
      <th width="81" scope="col">PARENT NAME</th>
      <th width="112" scope="col">PARENT PHONE NO:</th>
      <th width="109" scope="col">EMAIL ID</th>
      <th width="72" scope="col">&nbsp;</th>
    </tr>
      {% for i in data %}



    <tr>
      <td>{{ forloop.counter }}</td>
      <td>&nbsp;{{ i.parentname }}</td>
      <td>&nbsp;{{  i.phoneno}}</td>
      <td>{{  i.emailid }}</td>
      <td><p><a href="/editparent/{{ i.id }}">EDIT</a></p>
      <p><a href="/deleteparent/{{ i.id }}">DELETE</a></p></td>
    </tr>
      {% endfor %}
  </table>
</form>
</body>
</html>
