<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
<form id="form1" name="form1" method="post" action="">
  <table width="450" border="1">
    <tr>
      <th width="42" scope="col">#</th>
      <th width="111" scope="col">EVENT NAME</th>
      <th width="114" scope="col">EVENT DATE</th>
      <th width="75" scope="col">PHOTO</th>
      <th width="74" scope="col">&nbsp;</th>
    </tr>
      {% for i in data %}




    <tr>
      <td>&nbsp;{{  forloop.counter }}</td>
      <td>&nbsp;{{ i.eventname }}</td>
      <td>&nbsp;{{ i.eventdate }}</td>
      <td>&nbsp;<img src="{{ i.eventphoto }}" height="100" width="100" alt=""/></td>
      <td><p><a href="/editevent/{{ i.id }}">EDIT</a></p>
      <p><a href="/deleteevent/{{ i.id }}">DELETE</a></p></td>
    </tr>
      {% endfor %}
  </table>
</form>
</body>
</html>
