<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
<form id="form1" name="form1" method="post" action="">
  <table width="312" border="1">
    <tr>
      <th width="15" scope="col">#</th>
      <th width="46" scope="col">STAFF</th>
      <th width="70" scope="col">semester</th>
      <th width="75" scope="col">SUBJECT</th>
      <th width="72" scope="col">&nbsp;</th>
    </tr>
      {% for i in data %}



    <tr>
      <td>{{ forloop.counter }}</td>
      <td>{{ i.STAFF }}</td>
      <td>{{ i.semester }}</td>
      <td>{{ i.SUBJECT }}</td>
      <td><p><a href="/editsuballo/{{ i.id }}">EDIT</a></p>
      <p><a href="/deletesuballo/{{ i.id }}">DELETE</a></p></td>
    </tr>
      {% endfor %}
  </table>
</form>
</body>
</html>
