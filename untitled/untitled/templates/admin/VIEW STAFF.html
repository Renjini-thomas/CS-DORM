<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
<form id="form1" name="form1" method="post" action="">
  <table width="790" border="1">
    <tr>
      <th width="10" scope="col">#</th>
      <th width="58" scope="col">NAME</th>
      <th width="64" scope="col">PHOTO</th>
      <th width="146" scope="col">QUALIFICATION</th>
      <th width="85" scope="col">NUMBER</th>
      <th width="67" scope="col">EMAIL </th>
      <th width="120" scope="col">EXPERIANCE</th>
      <th width="47" scope="col">POST</th>
{#      <th width="61" scope="col">LOGIN</th>#}
      <th width="68" scope="col">&nbsp;</th>
    </tr>
      {% for i in data %}



    <tr>
      <td>&nbsp;{{ forloop.counter }}</td>
      <td>&nbsp;{{ i.staffname }}</td>
      <td>&nbsp;<img src="{{ i.photo }}" height="100" width="100" alt=""/> </td>
      <td>&nbsp;{{ i.qualification }}</td>
      <td>&nbsp;{{ i.number }}</td>
      <td>&nbsp;{{ i.email }}</td>
      <td>&nbsp;{{ i.staffexperiance }}</td>
      <td>&nbsp;{{ i.post }}</td>
{#      <td>&nbsp;</td>#}
      <td><p><a href="editstaff/{{ i.id }}">updaTE</a></p>
      <p><a href="/deletestaff/{{ i.id }}">DELETE</a></p></td>
    </tr>
      {% endfor %}
  </table>
</form>
</body>
</html>
