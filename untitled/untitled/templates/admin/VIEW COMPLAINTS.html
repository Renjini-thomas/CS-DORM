<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
<form id="form1" name="form1" method="post" action="">
  <table width="664" border="1">
    <tr>
      <th width="38" scope="col">#</th>
      <th width="138" scope="col">TITLE</th>
      <th width="88" scope="col">DATE</th>
      <th width="88" scope="col">DESCRIPTION</th>
      <th width="88" scope="col">REPLY</th>
      <th width="88" scope="col">REPLY DATE</th>
      <th width="90" scope="col">&nbsp;</th>
    </tr>
      {% for i in data %}




    <tr>
      <td>{{ forloop.counter }}</td>
      <td>&nbsp;{{ i.ctitle }}</td>
      <td>{{ i.cdescription }}</td>
      <td>&nbsp;{{ i.cdate }}</td>
      <td>{{ i.creply }}</td>
      <td>{{ i.rdate }}</td>
      <td><p><a href="#">Reply</a></p>
{#      <p><a href="/deletecomplaints/{{ i.id }}">DELETE</a></p>#}
      </td>
    </tr>
       {% endfor %}
  </table>
</form>
</body>
</html>
