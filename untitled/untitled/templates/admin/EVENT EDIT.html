<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
<form action="/eventeditbutton/{{ data.id }}" method="post" enctype="multipart/form-data" name="form1" id="form1">
    {% csrf_token %}
  <table width="292" border="1">
    <tr>
      <th width="173" scope="row">EVENT NAME</th>
      <td width="103"><label for="textfield"></label>
      <input type="text" name="textfield" id="textfield" value="{{ data.eventname }}" /></td>
    </tr>
    <tr>
      <th scope="row">EVENT DATE</th>
      <td><label for="textfield2"></label>
      <input type="text" name="textfield2" id="textfield2" value="{{ data.eventdate }}" /></td>
    </tr>
    <tr>
      <th scope="row">PHOTO</th>
      <td><label for="fileField"></label>
      <input type="file" name="fileField" id="fileField" value="{{ data.eventphoto}}" /></td>
    </tr>
    <tr>
      <th colspan="2" scope="row"><input type="submit" name="button" id="button" value="ADD" /></th>
    </tr>
  </table>
</form>
</body>
</html>
