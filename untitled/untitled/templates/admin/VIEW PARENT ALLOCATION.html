<body>
<form id="form1" name="form1" method="post" action="">
  <table width="287" border="1">

      <th width="10" scope="col">#</th>
      <th width="76" scope="col">PARENT</th>
      <th width="78" scope="col">STUDENT</th>

      {% for i in data %}



    <tr>
      <td>{{ forloop.counter }}</td>
      <td>{{ i.PARENT }}</td>
      <td>{{ i.STUDENT }}</td>
      <td><p><a href="/editpalloc/{{ i.id }}">EDIT</a></p>

    </tr>
      {% endfor %}
